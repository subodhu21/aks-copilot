# ServiceAccount — annotate with Workload Identity client ID if using managed identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aks-ai-agent
  namespace: platform-ops
  annotations:
    # Workload Identity: set to the client ID of your user-assigned managed identity
    # azure.workload.identity/client-id: "<managed-identity-client-id>"
---
# ClusterRole — read-only access to pods, logs, and events across all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aks-ai-agent-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aks-ai-agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aks-ai-agent-reader
subjects:
  - kind: ServiceAccount
    name: aks-ai-agent
    namespace: platform-ops
