# Secret template — create one per cluster, customising the values marked with <>.
# DO NOT commit real values. Populate via CI/CD pipeline or kubectl apply from a
# secrets manager (e.g. Azure Key Vault + External Secrets Operator).
#
# Deploy to each cluster:
#   kubectl apply -f manifests/namespace.yaml
#   kubectl apply -f manifests/secret.yaml   # after filling in values
#
# Alternatively, leave webhook/PAT values as @keyvault:<name> references and
# let keyvault_loader.py resolve them at runtime (requires Workload Identity).
apiVersion: v1
kind: Secret
metadata:
  name: aks-ai-agent-secrets
  namespace: platform-ops
type: Opaque
stringData:
  # ── Azure OpenAI ────────────────────────────────────────────────────────────
  AI_PROVIDER: "azure"
  AZURE_INFERENCE_ENDPOINT: "https://genai-lab-east-us2-sbx-ai-svc.openai.azure.com/openai/v1"
  AZURE_MODEL_DEPLOYMENT: "gpt-5.1"
  # Leave AZURE_API_KEY empty to use Workload Identity (DefaultAzureCredential)
  AZURE_API_KEY: ""
  AZURE_CHAT_TIMEOUT_SECONDS: "30"
  AZURE_TEMPERATURE: "1.0"
  AZURE_MAX_TOKENS: "1024"

  # ── Kubernetes ───────────────────────────────────────────────────────────────
  # Leave K8S_CONTEXT empty — the CronJob uses in-cluster config automatically
  K8S_CONTEXT: ""
  # Set to the namespace(s) this cluster's team owns
  K8S_NAMESPACE: "<namespace>"          # e.g. int, default, prod

  # ── MS Teams ─────────────────────────────────────────────────────────────────
  # One webhook URL per cluster/team — different for each cluster deployment
  MS_TEAMS_WEBHOOK_URL: "@keyvault:<secret-name>"   # e.g. @keyvault:ms-teams-webhook-api-gw

  # ── Slack (optional — sent alongside MS Teams; skipped gracefully if blank) ──
  SLACK_WEBHOOK_URL: "@keyvault:<secret-name>"   # e.g. @keyvault:slack-webhook-api-gw

  # ── Key Vault ────────────────────────────────────────────────────────────────
  AZURE_KEY_VAULT_URL: "https://ewazrapigwnp-kv.vault.azure.net/"

  # ── Azure DevOps ─────────────────────────────────────────────────────────────
  AZURE_DEVOPS_ORG: "techdatacorp"
  AZURE_DEVOPS_PROJECT: "<project>"     # e.g. Enterprise Distributed Development
  AZURE_DEVOPS_REPO: "<repo>"           # e.g. devops-api-gw
  AZURE_DEVOPS_PAT: "@keyvault:azure-devops-pat"
  RAISE_PR: "no"

  # ── Notification deduplication ───────────────────────────────────────────────
  NOTIFICATION_STATE_FILE: "/var/data/notification_state.json"
  NOTIFICATION_COOLDOWN_SECONDS: "3600"

  # ── Log scanning ─────────────────────────────────────────────────────────────
  LOG_ERROR_SCAN_ENABLED: "true"
  LOG_ERROR_THRESHOLD: "3"
  LOG_TAIL_LINES: "200"
