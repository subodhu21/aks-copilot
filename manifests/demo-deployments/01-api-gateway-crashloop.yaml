# Demo: CrashLoopBackOff — api-gateway is missing the REDIS_HOST env var
# it needs at startup, so the container exits immediately and Kubernetes
# keeps restarting it with exponential backoff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    demo: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$REDIS_HOST" ]; then
                echo "FATAL: REDIS_HOST environment variable is not set. Cannot connect to cache backend.";
                exit 1;
              fi
              echo "Connected to redis at $REDIS_HOST";
              sleep 3600
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
