# Local-demo variant of ../secret.yaml.
# No Key Vault / Workload Identity locally — values are plugged in directly by
# setup-local-demo.ps1 (placeholders below are replaced at apply-time, never
# committed with real values). Leaving AZURE_INFERENCE_ENDPOINT / API key blank
# is fine — agent.py automatically falls back to deterministic analysis.
apiVersion: v1
kind: Secret
metadata:
  name: aks-ai-agent-secrets
  namespace: platform-ops
type: Opaque
stringData:
  # ── Azure OpenAI (optional for the demo — falls back to deterministic analysis) ──
  AI_PROVIDER: "__AI_PROVIDER__"
  AZURE_INFERENCE_ENDPOINT: "__AZURE_ENDPOINT__"
  AZURE_MODEL_DEPLOYMENT: "__AZURE_MODEL__"
  AZURE_API_KEY: "__AZURE_API_KEY__"
  AZURE_CHAT_TIMEOUT_SECONDS: "30"
  AZURE_TEMPERATURE: "1.0"
  AZURE_MAX_TOKENS: "1024"

  # ── AWS Bedrock (optional — used when AI_PROVIDER=bedrock) ───────────────────
  AWS_REGION: "__AWS_REGION__"
  BEDROCK_MODEL_ID: "__BEDROCK_MODEL_ID__"
  BEDROCK_TEMPERATURE: "__BEDROCK_TEMPERATURE__"
  BEDROCK_MAX_TOKENS: "__BEDROCK_MAX_TOKENS__"
  AWS_ACCESS_KEY_ID: "__AWS_ACCESS_KEY_ID__"
  AWS_SECRET_ACCESS_KEY: "__AWS_SECRET_ACCESS_KEY__"
  AWS_SESSION_TOKEN: "__AWS_SESSION_TOKEN__"

  # ── Kubernetes ───────────────────────────────────────────────────────────────
  K8S_CONTEXT: ""
  K8S_NAMESPACE: "default"

  # ── Notifications ────────────────────────────────────────────────────────────
  NOTIFICATION_PROVIDER: "__NOTIFICATION_PROVIDER__"

  # ── MS Teams (optional — notification is skipped gracefully if blank) ────────
  MS_TEAMS_WEBHOOK_URL: "__TEAMS_WEBHOOK__"

  # ── Slack (optional — sent alongside MS Teams; skipped gracefully if blank) ──
  SLACK_WEBHOOK_URL: "__SLACK_WEBHOOK__"

  # ── Key Vault (disabled locally) ──────────────────────────────────────────────
  AZURE_KEY_VAULT_URL: ""

  # ── Azure DevOps (disabled locally — PR creation stays off) ──────────────────
  AZURE_DEVOPS_ORG: ""
  AZURE_DEVOPS_PROJECT: ""
  AZURE_DEVOPS_REPO: ""
  AZURE_DEVOPS_PAT: ""
  RAISE_PR: "no"

  # ── Notification deduplication (short cooldown so demo re-runs still alert) ──
  NOTIFICATION_STATE_FILE: "/var/data/notification_state.json"
  NOTIFICATION_COOLDOWN_SECONDS: "60"

  # ── Log scanning ─────────────────────────────────────────────────────────────
  LOG_ERROR_SCAN_ENABLED: "true"
  LOG_ERROR_THRESHOLD: "3"
  LOG_TAIL_LINES: "200"
