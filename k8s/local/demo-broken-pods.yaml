# Intentionally broken pods so the agent has something to detect/troubleshoot
# in a local demo. Deployed to the "default" namespace (matches K8S_NAMESPACE
# in k8s/local/secret.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: demo-crashloop
  namespace: default
  labels:
    app: demo-crashloop
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "echo 'Starting app...'; echo 'FATAL: Missing REDIS_HOST environment variable' >&2; sleep 2; exit 1"
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-imagepull
  namespace: default
  labels:
    app: demo-imagepull
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: myregistry.example.invalid/this-image-does-not-exist:v1
