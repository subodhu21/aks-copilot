# Fixed: API Gateway with REDIS_HOST provided - will run successfully
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
    tier: backend
    demo: crashloop-fixed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
    spec:
      restartPolicy: Always
      containers:
      - name: gateway
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "=== API Gateway Starting ==="
          echo "Checking required environment variables..."
          
          if [ -z "$REDIS_HOST" ]; then
            echo "ERROR: Missing REDIS_HOST environment variable" >&2
            echo "FATAL: Cannot start without Redis connection" >&2
            exit 1
          fi
          
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: Missing DATABASE_URL environment variable" >&2
            echo "FATAL: Cannot start without database connection" >&2
            exit 1
          fi
          
          echo "✅ All checks passed. Starting API Gateway..."
          echo "✅ Connected to Redis: $REDIS_HOST"
          echo "✅ Connected to Database: $DATABASE_URL"
          echo "✅ API Gateway is now healthy and running on port $PORT"
          
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - API Gateway: Processing requests... Status: Healthy"
            sleep 30
          done
        env:
        # NOW REDIS_HOST IS PROVIDED - will succeed
        - name: REDIS_HOST
          value: "redis-service.default.svc.cluster.local"
        - name: DATABASE_URL
          value: "postgres://db-service.default.svc.cluster.local:5432/appdb"
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
